<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A World Watch - Scratch & Win</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #111, #2b2b2b);
  font-family: Arial, sans-serif;
  color: white;
}

.card {
  width: 92%;
  max-width: 400px;
  background: white;
  color: #111;
  border-radius: 20px;
  padding: 25px 20px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.4);
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #c40000;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 20px;
}

.scratch-box {
  position: relative;
  width: 100%;
  height: 180px;
  border-radius: 15px;
  overflow: hidden;
  background: #f5f5f5;
  border: 2px solid #d0d0d0;
}

#result {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 1;
}

#discount {
  font-size: 42px;
  font-weight: bold;
  color: #c40000;
}

#code {
  font-size: 18px;
  font-weight: bold;
  margin-top: 8px;
}

#message {
  font-size: 14px;
  margin-top: 8px;
}

canvas {
  position: absolute;
  inset: 0;
  z-index: 2;
  cursor: pointer;
}

.address {
  margin-top: 20px;
  font-size: 14px;
  line-height: 1.5;
}

.shop {
  font-weight: bold;
  color: #c40000;
}

button {
  margin-top: 15px;
  padding: 12px 22px;
  border: none;
  border-radius: 25px;
  background: #c40000;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.note {
  margin-top: 12px;
  font-size: 12px;
  color: #666;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">A WORLD WATCH</div>
  <div class="subtitle">🎁 Scratch & Win 🎁</div>

  <div class="scratch-box">
    <div id="result">
      <div id="discount">...</div>
      <div id="code"></div>
      <div id="message"></div>
    </div>

    <canvas id="scratch"></canvas>
  </div>

  <div class="address">
    <div class="shop">A World Watch</div>
    Gandhi Nagar Mode,<br>
    Tonk Road, Jaipur
  </div>

  <div class="note">
    Scratch once to reveal your special discount.
  </div>

</div>

<script>
const canvas = document.getElementById("scratch");
const ctx = canvas.getContext("2d");

const box = document.querySelector(".scratch-box");

canvas.width = box.offsetWidth;
canvas.height = box.offsetHeight;

// Cover
ctx.fillStyle = "#777";
ctx.fillRect(0, 0, canvas.width, canvas.height);

// Cover design
ctx.fillStyle = "#fff";
ctx.font = "bold 25px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText("SCRATCH HERE", canvas.width / 2, canvas.height / 2);

// Small decoration
ctx.font = "16px Arial";
ctx.fillText("🎁 Reveal Your Discount 🎁", canvas.width / 2, canvas.height / 2 + 35);

let scratching = false;
let revealed = false;
let lastPoint = null;

function scratch(x, y) {
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();

  if (lastPoint) {
    ctx.moveTo(lastPoint.x, lastPoint.y);
    ctx.lineTo(x, y);
  } else {
    ctx.moveTo(x, y);
    ctx.lineTo(x + 1, y + 1);
  }

  ctx.lineWidth = 35;
  ctx.lineCap = "round";
  ctx.stroke();

  lastPoint = {x, y};

  checkReveal();
}

function getPosition(e) {
  const rect = canvas.getBoundingClientRect();

  if (e.touches) {
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    };
  }

  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

canvas.addEventListener("mousedown", e => {
  scratching = true;
  lastPoint = null;
});

canvas.addEventListener("mousemove", e => {
  if (!scratching || revealed) return;
  const p = getPosition(e);
  scratch(p.x, p.y);
});

window.addEventListener("mouseup", () => {
  scratching = false;
  lastPoint = null;
});

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  scratching = true;
  lastPoint = null;
});

canvas.addEventListener("touchmove", e => {
  e.preventDefault();

  if (!scratching || revealed) return;

  const p = getPosition(e);
  scratch(p.x, p.y);
}, {passive:false});

canvas.addEventListener("touchend", () => {
  scratching = false;
  lastPoint = null;
});

async function checkReveal() {

  if (revealed) return;

  const pixels = ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;

  let transparent = 0;

  for (let i = 3; i < pixels.length; i += 4) {
    if (pixels[i] === 0) {
      transparent++;
    }
  }

  const percentage =
    (transparent / (pixels.length / 4)) * 100;

  if (percentage > 35) {
    revealed = true;

    canvas.style.display = "none";

    await getDiscount();
  }
}

async function getDiscount() {

  try {

    const response = await fetch("/.netlify/functions/claim", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({})
    });

    if (!response.ok) {
      throw new Error("Claim failed");
    }

    const data = await response.json();

    document.getElementById("discount").innerText =
      data.discount + "% OFF";

    document.getElementById("code").innerText =
      "Code: " + data.code;

    document.getElementById("message").innerText =
      "Show this code at A World Watch";

  } catch (error) {

    document.getElementById("discount").innerText =
      "Please Try Again";

    document.getElementById("message").innerText =
      "Unable to generate discount.";
  }
}
</script>

</body>
</html>
